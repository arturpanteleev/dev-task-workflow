<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --canvas: #eef1f5;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --ink: #17202b;
      --muted: #647083;
      --line: #dce1e8;
      --accent: #315efb;
      --accent-soft: #edf1ff;
      --success: #16794b;
      --success-soft: #e9f7f0;
      --warning: #9a5b05;
      --warning-soft: #fff4dd;
      --danger: #b4233c;
      --danger-soft: #fff0f2;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --shadow: 0 24px 70px rgba(28, 38, 54, 0.08);
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      text-rendering: optimizeLegibility;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    code {
      overflow-wrap: anywhere;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.88em;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 920px;
      margin-bottom: 18px;
      font-size: clamp(2.35rem, 6vw, 5.25rem);
      font-weight: 720;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    h2 {
      margin-bottom: 0;
      font-size: clamp(1.65rem, 3vw, 2.55rem);
      font-weight: 680;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: white;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .page-shell {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 20px auto;
      overflow: hidden;
      border: 1px solid rgba(23, 32, 43, 0.08);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: clamp(32px, 6vw, 78px);
      background:
        radial-gradient(circle at 100% 0, rgba(49, 94, 251, 0.14), transparent 34%),
        linear-gradient(145deg, #fbfcff 0%, #f4f6fb 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero__eyebrow,
    .kicker {
      display: block;
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 760;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .hero__layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 36px;
      align-items: start;
    }

    .hero__lead {
      max-width: 780px;
      margin-bottom: 0;
      color: #3d4959;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
    }

    .hero__status,
    .hero__actions,
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .hero__status {
      justify-content: flex-end;
    }

    .hero__actions {
      margin-top: 32px;
    }

    .hero__meta {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 0.88rem;
      font-weight: 680;
      text-decoration: none;
    }

    .button:hover {
      filter: brightness(0.94);
      text-decoration: none;
    }

    .button--subtle {
      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 26px;
      padding: 3px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 740;
      letter-spacing: 0.015em;
      line-height: 1;
      white-space: nowrap;
    }

    .badge--accent {
      border-color: #cad5ff;
      background: var(--accent-soft);
      color: #2448c7;
    }

    .badge--success {
      border-color: #bee8d3;
      background: var(--success-soft);
      color: var(--success);
    }

    .badge--warning {
      border-color: #f2d498;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .badge--danger {
      border-color: #f0bdc7;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge--neutral {
      border-color: var(--line);
      background: var(--surface-soft);
      color: #526071;
    }

    .page-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px clamp(20px, 6vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      scrollbar-width: thin;
    }

    .page-nav a {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 8px;
      color: #536173;
      font-size: 0.82rem;
      font-weight: 650;
      text-decoration: none;
    }

    .page-nav a:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    main {
      padding: 0 clamp(20px, 6vw, 72px);
    }

    .section {
      padding: clamp(54px, 8vw, 92px) 0;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 66px;
    }

    .section--first {
      padding-top: clamp(46px, 7vw, 74px);
    }

    .section-heading {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 32px;
    }

    .section-heading > span {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 760;
    }

    .section-heading p {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 680;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-grid,
    .detail-grid,
    .compact-grid,
    .gate-grid,
    .control-grid,
    .repo-grid,
    .links-grid,
    .risk-grid,
    .attention-grid {
      display: grid;
      gap: 14px;
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .summary-card,
    .panel,
    .detail,
    .metric,
    .compact-card,
    .decision,
    .gate-card,
    .control-card,
    .unverified,
    .repo-card,
    .review-item,
    .risk-card,
    .next-steps,
    .link-card,
    .attention-card,
    .positive-state,
    .flow-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
    }

    .summary-card {
      min-height: 190px;
      padding: 24px;
      background: var(--surface-soft);
    }

    .summary-card p {
      margin: 0;
      font-size: 1.03rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--line);
    }

    .metric {
      display: flex;
      min-height: 140px;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 0;
      border-radius: 0;
    }

    .metric span,
    .metric small {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .metric strong {
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    .control-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 18px;
    }

    .control-card {
      min-height: 138px;
      padding: 20px;
    }

    .control-card small {
      display: block;
      margin-top: 10px;
      color: var(--muted);
    }

    .attention-grid,
    .risk-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .attention-card,
    .risk-card,
    .positive-state {
      padding: 20px;
      border-left-width: 4px;
    }

    .attention-card > div,
    .risk-card > div,
    .review-item > div {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .attention-card h3,
    .risk-card h3,
    .review-item h3 {
      margin: 0;
    }

    .attention-card p,
    .risk-card p,
    .positive-state p {
      margin-bottom: 0;
      color: #4f5b6c;
    }

    .attention-card--warning,
    .risk-card--warning {
      border-left-color: var(--warning);
    }

    .attention-card--danger,
    .risk-card--danger {
      border-left-color: var(--danger);
    }

    .attention-card--accent {
      border-left-color: var(--accent);
    }

    .risk-card--success {
      border-left-color: var(--success);
    }

    .positive-state {
      display: flex;
      grid-column: 1 / -1;
      gap: 12px;
      align-items: center;
      border-left-color: var(--success);
      background: var(--success-soft);
      color: var(--success);
    }

    .positive-state span {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: var(--success);
      color: white;
      font-weight: 800;
    }

    .two-column {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .panel {
      min-height: 180px;
      padding: 24px;
    }

    .panel--featured {
      border-color: #ccd6fc;
      background: linear-gradient(145deg, #f9faff, var(--accent-soft));
    }

    .detail-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 16px;
    }

    .detail,
    .compact-card {
      padding: 20px;
    }

    .detail p,
    .compact-card p,
    .panel p {
      margin-bottom: 0;
      color: #455264;
    }

    .clean-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 21px;
    }

    .clean-list li::marker {
      color: var(--accent);
    }

    .empty-state {
      margin: 0;
      color: var(--muted);
      font-style: italic;
    }

    .before-after {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 18px;
    }

    .flow-card {
      padding: 24px;
    }

    .flow-card--before {
      background: var(--surface-soft);
    }

    .flow-card--after {
      border-color: #bce2cf;
      background: var(--success-soft);
    }

    .flow-arrow {
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    .flow-arrow svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.5;
    }

    .details-block {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-soft);
    }

    .details-block summary {
      padding: 18px 20px;
      cursor: pointer;
      font-weight: 700;
    }

    .details-block > div {
      padding: 0 20px 20px;
    }

    .compact-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .gate-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 28px;
    }

    .gate-card {
      padding: 18px;
      background: var(--surface-soft);
    }

    .gate-card > div {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .gate-card h3,
    .gate-card p {
      margin-bottom: 0;
    }

    .gate-card p {
      color: var(--muted);
    }

    .subheading {
      margin-bottom: 14px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .decision,
    .unverified,
    .review-item,
    .next-steps {
      padding: 20px;
    }

    .decision small {
      color: var(--muted);
    }

    .decision--warning {
      border-left: 4px solid var(--warning);
    }

    .unverified,
    .next-steps {
      margin-top: 18px;
      background: var(--surface-soft);
    }

    .repo-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .repo-card {
      min-width: 0;
      padding: 24px;
    }

    .repo-card__header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .repo-card__header h3 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.25rem;
    }

    .metadata {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }

    .metadata div {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
    }

    .metadata dt {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .metadata dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-flex;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: #4e5b6c;
      font-size: 0.74rem;
    }

    .repo-card__changes {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.88rem;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .validation-columns {
      margin: 28px 0;
    }

    .review-item p {
      margin-bottom: 8px;
      color: #4b5869;
    }

    .review-item p:last-child {
      margin-bottom: 0;
    }

    .links-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .link-card {
      display: flex;
      min-width: 0;
      min-height: 138px;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      color: var(--ink);
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .link-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .link-card span {
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 760;
      letter-spacing: 0.1em;
    }

    .link-card strong {
      margin: 14px 0;
      overflow-wrap: anywhere;
    }

    .link-card small {
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 24px clamp(20px, 6vw, 72px);
      background: var(--ink);
      color: #c7d0dc;
      font-size: 0.82rem;
    }

    footer p {
      margin-bottom: 0;
    }

    footer a {
      color: white;
    }

    @media (max-width: 920px) {
      .summary-grid,
      .links-grid {
        grid-template-columns: 1fr;
      }

      .summary-card {
        min-height: auto;
      }

      .metrics-grid,
      .detail-grid,
      .repo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .before-after {
        grid-template-columns: 1fr;
      }

      .flow-arrow {
        height: 42px;
      }

      .flow-arrow svg {
        transform: rotate(90deg);
      }
    }

    @media (max-width: 680px) {
      .page-shell {
        width: 100%;
        margin: 0;
        border-width: 0;
        border-radius: 0;
      }

      .hero {
        padding: 32px 20px;
      }

      .hero__layout,
      .two-column,
      .detail-grid,
      .compact-grid,
      .gate-grid,
      .control-grid,
      .repo-grid,
      .attention-grid,
      .risk-grid,
      .validation-columns {
        grid-template-columns: 1fr;
      }

      .hero__status {
        justify-content: flex-start;
      }

      .hero__actions {
        align-items: stretch;
        flex-direction: column;
      }

      .button {
        justify-content: center;
        text-align: center;
      }

      main {
        padding: 0 20px;
      }

      .section-heading {
        grid-template-columns: 36px 1fr;
        gap: 12px;
      }

      .section-heading > span {
        width: 34px;
        height: 34px;
      }

      .metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric {
        min-height: 120px;
      }

      .metadata div {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      footer {
        gap: 16px;
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .page-nav {
        padding-inline: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .link-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
{{REPORT_BODY}}
</body>
</html>
